version: '3.8'

services:
  # ==========================================
  # Database: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: acneguard-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acneguard}
      POSTGRES_USER: ${POSTGRES_USER:-acneguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acneguard_user} -d ${POSTGRES_DB:-acneguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acneguard-network

  # ==========================================
  # Backend API: FastAPI + Gunicorn
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: acneguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-acneguard_user}:${POSTGRES_PASSWORD:-secure_db_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-acneguard}
      SECRET_KEY: ${SECRET_KEY:-prod_super_secret_jwt_key_must_be_configured_at_least_32_chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      MAX_UPLOAD_SIZE_MB: 10
    networks:
      - acneguard-network

  # ==========================================
  # Frontend & Reverse Proxy: Nginx + React SPA
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: acneguard-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - acneguard-network

# ==========================================
# Persistent Volumes & Networks
# ==========================================
volumes:
  postgres_data:
    driver: local

networks:
  acneguard-network:
    driver: bridge
